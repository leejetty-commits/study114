<!doctype html><meta charset="utf-8"><body>
    <article class="expo-card expo-card--prime expo-card--study_room" data-provider-id="1" data-provider-kind="study_room">
      
    <div class="expo-media-wrap">
      <div class="expo-media expo-media--prime"><img src="/assets/brand/room-card-default-prime.svg" alt="검사용 공부방" loading="lazy" /></div>
      <div class="expo-media-overlay" aria-hidden="false"><div class="expo-media-overlay__tl"><span class="expo-overlay-val"></span></div></div>
    </div>
      <table class="expo-tbl expo-tbl--card"><tbody><tr class="expo-tbl__row"><td class="expo-tbl__cell expo-tbl__cell--val-only expo-tbl__cell--name" colspan="2">검사용 공부방</td></tr><tr class="expo-tbl__row"><td class="expo-tbl__cell expo-tbl__cell--badges" colspan="2"><div class="card-visual__promo" aria-label="주목·신규 배지"><span class="card-visual__promo-badge card-visual__promo-badge--hot">Hot</span></div><span class="card-visual__trust-badge expo-tbl__badge">교육청등록</span><span class="card-visual__trust-badge expo-tbl__badge">경력 5년</span></td></tr><tr class="expo-tbl__row"><td class="expo-tbl__cell"><span class="expo-tbl__label">대상</span><span class="expo-tbl__val">중등</span></td><td class="expo-tbl__cell expo-tbl__cell--val-only expo-tbl__cell--price"></td></tr><tr class="expo-tbl__row"><td class="expo-tbl__cell" colspan="2"><span class="expo-tbl__label">과목</span><span class="expo-tbl__val">수학</span></td></tr><tr class="expo-tbl__row"><td class="expo-tbl__cell"><span class="expo-tbl__label">교습형태</span><span class="expo-tbl__val">(선택)</span></td><td class="expo-tbl__cell"><span class="expo-tbl__label">원생수</span><span class="expo-tbl__val"></span></td></tr><tr class="expo-tbl__row"><td class="expo-tbl__cell" colspan="2"><span class="expo-tbl__label">수업형태</span><span class="expo-tbl__val"></span></td></tr><tr class="expo-tbl__row"><td class="expo-tbl__cell expo-tbl__cell--features" colspan="2"><span class="expo-tbl__label">특징</span><span class="expo-tbl__val"></span></td></tr><tr class="expo-tbl__row"><td class="expo-tbl__cell expo-tbl__cell--intro" colspan="2"><span class="expo-tbl__label">소개</span><span class="expo-tbl__val"></span></td></tr><tr class="expo-tbl__row"><td class="expo-tbl__cell expo-tbl__cell--slogan" colspan="2"><span class="expo-tbl__label">슬로건</span><span class="expo-tbl__val"></span></td></tr><tr class="expo-tbl__row"><td class="expo-tbl__cell expo-tbl__cell--actions" colspan="2">
    <div class="card-visual__rail" data-card-visual="2026-08-21">
      <div class="card-stats" aria-label="통계"><button type="button" class="item-actions__btn item-actions__btn--stat" title="추천하기" aria-label="추천" data-action="recommend-toggle" data-item-kind="study_room" data-item-id="1">
    <span class="item-actions__icon" aria-hidden="true">👍</span><span class="item-actions__count">3</span>
  </button><button type="button" class="item-actions__btn item-actions__btn--stat" title="후기 보기" aria-label="후기" data-action="open-review-sheet" data-item-kind="study_room" data-item-id="1">
    <span class="item-actions__icon" aria-hidden="true">💬</span><span class="item-actions__count">1</span>
  </button></div>
      <div class="item-actions card-actions" aria-label="기능"><button type="button" class="item-actions__btn item-actions__btn--action" title="찜하기" aria-label="찜" data-action="wish-toggle" data-item-kind="study_room" data-item-id="1">
    <span class="item-actions__icon" aria-hidden="true">♡</span><span class="item-actions__count"><span class="item-actions__count-empty">없음</span></span>
  </button><button type="button" class="item-actions__btn item-actions__btn--action" title="비교하기" aria-label="비교" data-action="compare-toggle" data-item-kind="study_room" data-item-id="1">
    <span class="item-actions__icon" aria-hidden="true">⇄</span><span class="item-actions__count"><span class="item-actions__count-empty">없음</span></span>
  </button><button type="button" class="item-actions__btn item-actions__btn--action" title="쪽지 보내기" aria-label="쪽지" data-action="open-detail-memo" data-item-kind="study_room" data-item-id="1">
    <span class="item-actions__icon" aria-hidden="true">✉</span><span class="item-actions__count"><span class="item-actions__count-empty">없음</span></span>
  </button></div>
    </div>
  </td></tr></tbody></table>
    </article></body>
