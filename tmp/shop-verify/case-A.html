<article class="shop" data-myshop data-shop data-shop-root data-shop-sections="hero,facts,signature,gallery,classes,career,trust,facilities,livingArea,social,reviews,inquiry">
      
    <header class="shop-hero" data-shop-section="hero">
      <div class="shop-hero__media">
        <img
          src="/assets/listings/room-1.jpg"
          alt="검증 공부방"
          data-shop-fallback="/assets/brand/room-card-default-basic.svg"
          onerror="if(this.dataset.fb)return;this.dataset.fb='1';this.src=this.getAttribute('data-shop-fallback')||'';"
        />
      </div>
      <div class="shop-hero__card">
        <p class="shop-hero__eyebrow">동네의 작은 공부방</p>

        <p class="shop-hero__area">강남구 · 대치동 생활권</p>
        <ul class="shop-hero__chips"><li>중등 고등</li><li>수학</li><li>공부방</li></ul>
      </div>
    </header>
<section class="shop-bento" aria-label="핵심 정보" data-shop-section="facts">
        <ul class="shop-bento__grid">

            </li>
            <li class="shop-bento__item">
              <span class="shop-bento__label">가격대</span>

            <li class="shop-bento__item">
              <span class="shop-bento__label">수업형태</span>

            <li class="shop-bento__item">

            </li>
            <li class="shop-bento__item">
              <span class="shop-bento__label">주말</span>
              <strong class="shop-bento__value">가능</strong>
            </li>
            <li class="shop-bento__item">
              <span class="shop-bento__label">첨삭</span>
              <strong class="shop-bento__value">운영</strong>
            </li>
            <li class="shop-bento__item">
              <span class="shop-bento__label">카드결제</span>
              <strong class="shop-bento__value">가능</strong>

    <section class="shop-sec shop-sec--livingArea" data-shop-section="livingArea">
      <h2 class="shop-sec__title"><span class="shop-sec__mark" aria-hidden="true"></span>위치 · 생활권</h2>

    </section>


    <section class="shop-sec shop-sec--reviews" data-shop-section="reviews">
      <h2 class="shop-sec__title"><span class="shop-sec__mark" aria-hidden="true"></span>후기</h2>
      <div class="shop-sec__body"><div class="shop-review-teaser" data-shop-review-teaser data-provider-type="study_room" data-provider-id="0"></div></div>

<footer class="shop-inquiry" role="status" data-shop-section="inquiry">
        <span class="shop-inquiry__label">문의 안내</span>
