<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8F0FA"/>
      <stop offset="45%" stop-color="#F3EFE6"/>
      <stop offset="100%" stop-color="#E6EEF7"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="700" y1="0" x2="1280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#266BC4" stop-opacity="0"/>
      <stop offset="55%" stop-color="#266BC4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1C325A" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1280" height="280" fill="url(#sky)"/>
  <!-- soft geometric / education-adjacent abstract shapes (no faces) -->
  <g filter="url(#blur)" opacity="0.55">
    <circle cx="980" cy="40" r="120" fill="#A8C5E8"/>
    <circle cx="1120" cy="200" r="90" fill="#C9D9EF"/>
    <ellipse cx="860" cy="220" rx="140" ry="70" fill="#D4E4F5"/>
    <rect x="720" y="30" width="160" height="100" rx="24" fill="#B8D0EA" transform="rotate(12 800 80)"/>
    <path d="M640 180 L720 60 L800 180 Z" fill="#9BB8DC" opacity="0.7"/>
  </g>
  <!-- subtle grid / notebook lines on right -->
  <g opacity="0.12" stroke="#266BC4" stroke-width="1">
    <line x1="780" y1="40" x2="1240" y2="40"/>
    <line x1="780" y1="70" x2="1240" y2="70"/>
    <line x1="780" y1="100" x2="1240" y2="100"/>
    <line x1="780" y1="130" x2="1240" y2="130"/>
    <line x1="780" y1="160" x2="1240" y2="160"/>
    <line x1="780" y1="190" x2="1240" y2="190"/>
    <line x1="780" y1="220" x2="1240" y2="220"/>
    <line x1="780" y1="250" x2="1240" y2="250"/>
  </g>
  <!-- soft book/card silhouette -->
  <g opacity="0.2" fill="#266BC4">
    <rect x="980" y="90" width="110" height="140" rx="8"/>
    <rect x="1060" y="70" width="100" height="150" rx="8"/>
  </g>
  <rect width="1280" height="280" fill="url(#softBlue)"/>
</svg>
