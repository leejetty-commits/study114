# ShopPage CI gate — 회귀 실패 시 PR 머지 차단
# main 은 deploy.yml 의 verify-shop-page 작업이 배포 전에 같은 검사를 돌린다 → main push 트리거는 두지 않는다
# (중복 제거, Actions 시간 줄이기 2026-10-14 사용자 결정).
# 정본: docs/internal/54-shop-page-lock.md

name: ShopPage gate

on:
  pull_request:

concurrency:
  group: shop-page-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-shop-page:
    name: verify:shop-page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: preview/home-ui/package-lock.json

      - name: Install home-ui deps
        working-directory: preview/home-ui
        run: npm ci

      - name: Guard — ShopPage regression
        run: npm run verify:shop-page
