# 공부방 등록점검 — 과외쌤과 같은 공통 프레임 (카드 샘플 유지)

name: Study-room registration-check frame

on:
  pull_request:
    paths:
      - "preview/home-ui/src/study-room-reg/registration-check-*.js"
      - "preview/home-ui/src/study-room-reg/screens.js"
      - "preview/home-ui/src/styles/registration-check.css"
      - "scripts/verify-study-room-registration-check-frame.mjs"
      - "package.json"
      - ".github/workflows/study-room-registration-check-frame.yml"
  push:
    branches:
      - main
    paths:
      - "preview/home-ui/src/study-room-reg/registration-check-*.js"
      - "preview/home-ui/src/study-room-reg/screens.js"
      - "preview/home-ui/src/styles/registration-check.css"
      - "scripts/verify-study-room-registration-check-frame.mjs"
      - "package.json"
      - ".github/workflows/study-room-registration-check-frame.yml"

concurrency:
  group: study-room-registration-check-frame-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-study-room-registration-check-frame:
    name: verify:study-room-registration-check-frame
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Guard — study-room registration-check frame
        run: npm run verify:study-room-registration-check-frame
