# 회원 생활 메일(첫 일주일 안부 · Prime/Pick 마무리 3일 전) — 낮 동안 한 시간에 두 번 운영 cron 주소를 부른다.
# 보낼 대상 고르기·나눠 보내기·하루 한도는 서버(MemberMailScheduler)가 한다. 이 작업은 깨우기만 한다.
# schedule은 기본 브랜치(main)에 있을 때만 돈다. GitHub는 붐빌 때(특히 정각 무렵) 예약 실행을 버릴 수 있다
# (2026-10-14: 매시 7분 11번 중 9번 버려짐). 그래서 정각·15·30·45분을 피하고, 서버는 안부 7~10일 ·
# 마무리 3일 전(못 보내면 2일 전)으로 대상에게 하루 이상 기회를 둔다. 정본 74 §3.

name: member-mail-cron

on:
  schedule:
    # UTC 00~11시 17분·43분 = KST 09:17~20:43, 하루 24번 (KST 낮 = 미국 밤)
    - cron: "17,43 0-11 * * *"
  workflow_dispatch:

concurrency:
  group: member-mail-cron
  cancel-in-progress: false

permissions: {}

jobs:
  call:
    if: github.repository == 'leejetty-commits/study114'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/cron/member-mail.php
        env:
          CRON_KEY: ${{ secrets.STUDY114_REPORT_CRON_KEY }}
        run: |
          if [ -z "$CRON_KEY" ]; then
            echo "::error::Secret STUDY114_REPORT_CRON_KEY is not set"
            exit 1
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 60 \
            -X POST -H "X-Cron-Key: ${CRON_KEY}" \
            https://study114.net/api/cron/member-mail.php)
          echo "HTTP ${code}"
          cat response.json; echo
          test "$code" = "200"
