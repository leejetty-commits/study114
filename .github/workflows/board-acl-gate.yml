# Board ACL CI gate — JS/PHP 매트릭스. DB 불필요.
# PR·작업 브랜치에서는 검증만. FTP 배포 없음.

name: Board ACL gate

on:
  pull_request:
  push:

concurrency:
  group: board-acl-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-board-acl:
    name: verify:board-acl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — Board ACL (PHP + JS)
        uses: ./.github/actions/verify-board-acl
