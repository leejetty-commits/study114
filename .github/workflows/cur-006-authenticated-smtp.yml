# CUR-006 authenticated SMTP — PHP 8.2 runtime gate (no FTP / no production)

name: cur-006-authenticated-smtp

on:
  push:
    branches:
      - fix/cur-006-authenticated-smtp
  pull_request:
    branches:
      - main
    paths:
      - "src/Mail/**"
      - "src/Auth/AuthMailer.php"
      - "public/api/auth/password/_mail-probe.php"
      - "config/auth.php"
      - "scripts/verify-cur-006-authenticated-smtp.*"
      - "scripts/php-syntax-check.sh"
      - ".github/workflows/cur-006-authenticated-smtp.yml"

jobs:
  php82-mail-gate:
    name: PHP 8.2 mail gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring
          coverage: none

      - name: Show PHP version
        run: |
          php -v
          php -r 'echo "PHP_VERSION_ID=".PHP_VERSION_ID."\n";'
          test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "8.2"

      - name: PHP syntax check
        run: bash scripts/php-syntax-check.sh

      - name: CUR-006 authenticated SMTP mock
        run: php scripts/verify-cur-006-authenticated-smtp.php

      - name: Node static contract
        run: npx --yes vite-node scripts/verify-cur-006-authenticated-smtp.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "## CUR-006 PHP_RUNTIME_GATE"
            echo "- PHP: \`$(php -r 'echo PHP_VERSION;')\`"
            echo "- php -l: via scripts/php-syntax-check.sh"
            echo "- mock: scripts/verify-cur-006-authenticated-smtp.php"
            echo "- static: scripts/verify-cur-006-authenticated-smtp.mjs"
            echo "- deploy: not run"
          } >> "$GITHUB_STEP_SUMMARY"
