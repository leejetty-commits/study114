<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>견본 — 결제 취소됨</title>
  <link rel="stylesheet" href="../../../../preview/home-ui/src/styles/mypage-ops.css">
  <style>
    body { margin: 16px; background: #fff; }
    .fixture-label { margin: 0 0 8px; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <p class="fixture-label">견본. 운영 데이터가 아닙니다.</p>
  <div class="plans-hist-row is-open" data-v3-row="sample">
    <div class="plans-hist-row__bar">
      <div class="plans-hist-row__info">
        <span class="plans-hist-row__name">쪽지권 · 5회권</span><span class="plans-hist-row__st plans-hist-row__st--no">결제 취소됨</span><span class="plans-hist-row__meta">2,250원 · 2026-11-14</span>
      </div>
      <div class="plans-hist-row__acts">
        <button type="button" class="is-cell-active">내역</button>
        <button type="button" disabled>진행상황</button>
        <button type="button" disabled>종료</button>
        <button type="button" disabled>소멸</button>
      </div>
    </div>
    <div class="plans-hist-row__panel">
      <div class="plans-hist-row__panel-inner"><p>선택한 상품을 지금 지급할 수 없어 결제를 자동으로 취소했어요. 카드사에 따라 환불까지 3~5영업일 걸릴 수 있어요.</p></div>
    </div>
  </div>
</body>
</html>
