<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>견본 실패</title>
  <link rel="stylesheet" href="../../../../../preview/home-ui/src/styles/tokens.css">
  <link rel="stylesheet" href="../../../../../preview/home-ui/src/styles/home.css">
  <link rel="stylesheet" href="../../../../../preview/home-ui/src/styles/design-system.css">
  <link rel="stylesheet" href="../../../../../preview/home-ui/src/styles/home-admin.css">
</head>
<body>
  <p style="margin:12px 16px;color:#64748b;font-size:12px">견본. 운영 데이터가 아닙니다.</p>
  <div style="padding:16px">
    <section class="admin-state admin-console-unlock">
      <h2>운영 콘솔 잠금</h2>
      <p>콘솔에 들어가려면 2차 비밀번호 6자가 필요해요. (영문 대문자 1 · 소문자 1 · 숫자 2 · 특수문자 2)</p>
      <p class="admin-console-unlock__message" hidden></p>
      <form class="admin-console-unlock-form" autocomplete="off">
        <label>2차 비밀번호
          <input type="password" name="password" maxlength="6" autocomplete="current-password">
        </label>
        <p class="admin-console-unlock__error">비밀번호가 맞지 않아요. 남은 횟수 3회.</p>
        <button type="submit" class="btn btn--primary">잠금 해제</button>
      </form>
    </section>
  </div>
</body>
</html>
