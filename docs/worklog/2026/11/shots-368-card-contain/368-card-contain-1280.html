<!doctype html><html lang="ko"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>368-card-contain 1280</title>
<style>
  :root { --gray-100: #f1f5f9; --space-2: 0.5rem; }
  body { margin: 0; background: #fff; font-family: system-ui, sans-serif; color: #0f172a; }
  h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
  h2 { font-size: 0.95rem; margin: 1.25rem 0 0.5rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; padding: 1rem 1.25rem 2rem; max-width: 1280px; }
  .note { font-size: 0.8rem; color: #64748b; margin: 0 0 0.75rem; }
  .label { font-size: 0.75rem; font-weight: 650; margin: 0 0 0.35rem; }
  /* 카드 목록 미디어 */
  /**
 * Home listings / Prime·Pick / map·list cards — extracted from home.css
 * Rollback: git revert this commit.
 */

/* 섹션 타이틀 — 단독행 · 프라임/픽 중앙 · 베이직 좌측 · 현재위치는 section-toolbar */
.section-heading {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  align-items: stretch;
  gap: var(--space-1);
  margin: 0 0 var(--space-2);
  padding-top: var(--space-3);
  width: 100%;
}

.section-heading:first-child {
  padding-top: 0;
}

.section-heading__main {
  flex: 0 0 auto;
  width: 100%;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 0.55rem;
  text-align: left;
}

.section-heading--start .section-heading__main {
  justify-content: flex-start;
  text-align: left;
}

.section-heading--center .section-heading__main {
  justify-content: center;
  text-align: center;
}

.section-heading__brand {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-start;
  gap: 0.45rem 0.55rem;
}

.section-heading--center .section-heading__brand {
  justify-content: center;
}

.section-heading__brand-text {
  font-family: var(--font-serif);
  font-size: 1.15em;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.section-heading__emoji {
  font-size: 1.35rem;
  line-height: 1.2;
  flex-shrink: 0;
}

.section-heading__logo {
  flex-shrink: 0;
  height: 1.35rem;
  width: auto;
}

.section-heading--basic .section-heading__logo,
.section-heading--start .section-heading__logo {
  height: 1.2rem;
}

.section-heading .brand-lockup--section {
  flex-shrink: 0;
}

.section-heading__title {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--gray-900);
  margin: 0;
  line-height: 1.25;
  letter-spacing: -0.02em;
}

.section-heading__desc {
  font-size: var(--text-xs);
  color: var(--gray-500);
  line-height: 1.35;
  margin: 0;
  width: 100%;
  text-align: left;
}

.section-heading--center .section-heading__desc {
  text-align: center;
}

/* 현재위치 — 정렬 바로 앞, 같은 덩어리(우측 병렬) */
.section-heading__loc {
  display: inline-flex;
  align-items: baseline;
  flex-wrap: wrap;
  justify-content: flex-start;
  gap: 0.3rem 0.4rem;
  flex: 0 0 auto;
  text-align: left;
}
.section-heading__loc-label {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--gray-500);
  line-height: 1.25;
}
.section-heading__loc-value {
  font-size: var(--text-base);
  font-weight: 700;
  color: var(--gray-900);
  line-height: 1.25;
}

.section-toolbar {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: center;
  justify-content: flex-end;
  gap: 0;
  margin: 0 0 0.65rem;
  min-height: 2rem;
  width: 100%;
}

.section-toolbar__cluster {
  display: inline-flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 0.55rem 0.85rem;
  margin-left: auto;
  max-width: 100%;
}

.section-toolbar .section-heading__loc {
  margin: 0;
}

.section-toolbar__sort {
  margin: 0;
  display: flex;
  align-items: center;
  flex: 0 0 auto;
}

.section-toolbar__sort .list-sort-bar {
  margin: 0;
  min-height: 0;
  justify-content: flex-start;
}

/* 프라임 — 금색 · 중앙 · 좌우 장식 */
.section-heading--prime .section-heading__title,
.section-heading--prime .section-heading__brand-text {
  color: #b8860b;
  background: linear-gradient(105deg, #8b6914 0%, #d4af37 45%, #f0d78c 55%, #b8860b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 1.25rem;
}
.section-heading--prime .section-heading__ornament {
  color: #c9a227;
  border-color: #c9a227;
}

/* 픽 — 은색 · 중앙 · 동일 장식 구조 */
.section-heading--pick .section-heading__title,
.section-heading--pick .section-heading__brand-text {
  color: #6b7280;
  background: linear-gradient(105deg, #4b5563 0%, #9ca3af 45%, #e5e7eb 55%, #6b7280 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 1.25rem;
}
.section-heading--pick .section-heading__ornament {
  color: #9ca3af;
  border-color: #9ca3af;
}

/* 베이직 — 하늘색/블루 · 좌측 · 픽/프라임보다 1단계 작게 · 아래 여백 최소화 */
.section-heading--basic .section-heading__title,
.section-heading--basic .section-heading__brand-text {
  color: #2563eb;
  font-size: 1.125rem;
}
.section-heading--basic .section-heading__ornament {
  display: none;
}

.section-heading--basic {
  margin-bottom: var(--home-basic-title-gap, var(--space-2));
  gap: 0;
}

/* 베이직만: 제목(앞) + 현재위치·정렬(뒤). 데스크탑 한 행, 넘치면 자연 줄바꿈 */
.section-title-bar--basic {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-start;
  gap: 0.35rem var(--space-3);
  margin: 0 0 var(--home-basic-title-gap, var(--space-2));
  width: 100%;
}

.section-title-bar--basic .section-heading {
  margin: 0;
  margin-bottom: 0; /* C 간격은 title-bar mb만 — heading과 이중 금지 */
  padding-top: 0;
  width: auto;
  flex: 0 0 auto;
}

.section-title-bar--basic .section-heading__main {
  width: auto;
}

.section-title-bar--basic .section-toolbar {
  margin: 0 0 0 auto;
  width: auto;
  flex: 0 1 auto;
  min-height: 0;
  flex-wrap: wrap;
}

.section-title-bar--basic .section-toolbar__cluster {
  margin-left: 0;
}

.section-heading__ornament {
  flex-shrink: 0;
  width: 2.75rem;
  height: 0.7rem;
  position: relative;
  display: inline-block;
}
.section-heading__ornament::before,
.section-heading__ornament::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 100%;
  height: 1px;
  background: currentColor;
  opacity: 0.75;
  transform: translateY(-50%);
}
.section-heading__ornament::after {
  width: 0.45rem;
  height: 0.45rem;
  border: 1.5px solid currentColor;
  border-radius: 50%;
  background: transparent;
  opacity: 1;
}
.section-heading__ornament--left::after {
  left: 0;
  right: auto;
}
.section-heading__ornament--right::before {
  /* mirror */
}
.section-heading__ornament--right::after {
  right: 0;
  left: auto;
}
.section-heading__ornament--left::before {
  left: 0.55rem;
  background: linear-gradient(90deg, transparent, currentColor);
}
.section-heading__ornament--right::before {
  right: 0.55rem;
  left: auto;
  background: linear-gradient(270deg, transparent, currentColor);
}

.list-subsection .section-heading {
  padding-top: var(--space-4);
}

.list-subsection .section-heading--basic {
  padding-top: 0;
  margin-bottom: 0;
}

.list-subsection > .section-title-bar--basic {
  padding-top: var(--space-3);
}

/* content-section 안 티어(픽 등) 블록 경계 = ① 전체 (프라임 카드 아래 바로 pt) */
.home-shell--guest .home-main .content-section .list-subsection > .section-heading,
.home-shell--study_room .home-main .content-section .list-subsection > .section-heading,
.home-shell--tutor .home-main .content-section .list-subsection > .section-heading,
.home-shell--parent .home-main .content-section .list-subsection > .section-heading,
.home-shell--guest .home-main .content-section .list-subsection > .section-title-bar--basic,
.home-shell--study_room .home-main .content-section .list-subsection > .section-title-bar--basic,
.home-shell--tutor .home-main .content-section .list-subsection > .section-title-bar--basic,
.home-shell--parent .home-main .content-section .list-subsection > .section-title-bar--basic {
  margin-top: 0;
  padding-top: var(--home-block-gap, 3.5rem);
}

/* 베이직 연속 블록 경계 = ① (title-bar pt + prev mb) */
.home-shell--guest .guest-browse-lists .list-subsection + .list-subsection > .section-title-bar--basic,
.home-shell--study_room .home-main .guest-browse-lists .list-subsection + .list-subsection > .section-title-bar--basic,
.home-shell--tutor .home-main .guest-browse-lists .list-subsection + .list-subsection > .section-title-bar--basic,
.home-shell--parent .home-main .guest-browse-lists .list-subsection + .list-subsection > .section-title-bar--basic {
  padding-top: var(--space-8);
}

/* 학생 홈 「우리동네 과외쌤」만.
   희망 지역 아래 선이 두 줄인 이유:
   .parent-home-region border-bottom (home.css) 과
   .search-results border-top (search.css, .search-results--pre 의 border-top:none 을 같은 특이도로 덮음).
   이 탭에서는 결과 구역의 border-top 만 끈다. 지역 표시의 border-bottom 이 한 줄로 남는다. */
.home-shell--parent .parent-home-region--tutor + .search-results.search-results--pre {
  border-top: none;
}

/* 학생 홈 「우리동네 과외쌤」 픽·베이직 여백.
   310 게스트와 동일 리듬, 선 없음 — 311 */
.home-shell--parent .content-section--blue {
  --tier-section-gap: var(--home-block-gap, var(--space-8));
}

.home-shell--parent .content-section--blue .list-subsection .section-heading--pick,
.home-shell--parent .content-section--blue .list-subsection > .section-title-bar--basic {
  margin-top: 0;
  padding-top: var(--tier-section-gap);
}

.list-sort-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  margin: 0 0 0.65rem;
  min-height: 2rem;
}

.list-sort-bar__label {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin: 0;
  font-size: 0.8125rem;
  color: var(--gray-600, #64748b);
}

.list-sort-bar__text {
  font-weight: 600;
  white-space: nowrap;
}

.list-sort-bar__select {
  min-width: 8.5rem;
  padding: 0.35rem 0.55rem;
  border: 1px solid var(--gray-300, #d1d5db);
  border-radius: 0.4rem;
  background: #fff;
  color: var(--gray-800, #1e293b);
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.3;
  cursor: pointer;
}

.list-sort-bar__select:hover,
.list-sort-bar__select:focus {
  border-color: var(--brand-blue, #2563eb);
  outline: none;
}

.search-flat-results .list-sort-bar,
.search-tier-results .list-sort-bar {
  margin-top: 0.15rem;
}

/* 게스트 베이직·학생 목록 블록 — 이전 섹션과의 경계는 ①(--home-block-gap) */
.guest-browse-lists {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}

.guest-browse-lists .list-subsection {
  margin-bottom: calc(var(--home-block-gap, 3.5rem) - var(--space-8, 2rem));
}

.guest-browse-lists .browse-list {
  margin-top: 0;
}

.guest-browse-lists > .list-subsection:first-child .section-heading {
  padding-top: 0;
}

/* 첫 베이직 제목바: 섹션 진입을 C와 분리해 --home-block-gap 체감 */
.home-shell--guest .guest-browse-lists > .list-subsection:first-child > .section-title-bar--basic {
  padding-top: var(--space-8);
}

.guest-browse-lists .list-subsection--students {
  margin-top: 0;
}

.home-shell--guest .guest-browse-lists + .guest-browse-lists {
  margin-top: calc(var(--home-block-gap, 3.5rem) - var(--space-8, 2rem));
}

.home-shell--guest .guest-browse-lists + .guest-browse-lists > .list-subsection:first-child > .section-title-bar--basic {
  padding-top: var(--space-8);
}

/* 학생 티저(게스트) — 컴팩트 카드 톤 (마스킹 로직 불변) */
.expo-basic--student-teaser {
  padding: 0.55rem 0.7rem;
  height: 100%;
  box-sizing: border-box;
}

.student-teaser__name {
  margin: 0;
  font-size: 0.9375rem;
  font-weight: 700;
  color: var(--gray-900);
}

.student-teaser__meta {
  margin: var(--space-1) 0 0;
  font-size: 0.8125rem;
  color: var(--gray-600);
  line-height: 1.4;
}

.student-teaser__hope {
  margin: 0.125rem 0 0;
  font-size: 0.75rem;
  color: var(--gray-500);
}

.student-teaser__hint {
  margin: var(--space-2) 0 0;
  font-size: 0.6875rem;
  color: var(--gray-400);
  line-height: 1.35;
}

.expo-basic--student-teaser .item-actions {
  margin-top: var(--space-2);
}

.item-actions__note {
  font-size: 0.6875rem;
  color: var(--gray-400);
  line-height: 1.35;
}

.tier-row {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  margin: var(--space-2) 0 0.125rem;
}

.tier-row--pick {
  margin-top: var(--space-3);
}

.tier-row--basic {
  margin-top: var(--space-3);
}

.tier-row__label {
  font-size: 0.6875rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--brand-blue);
}

.content-section--blue .tier-row__label {
  color: var(--brand-blue);
}

.tier-row__note {
  font-size: 0.6875rem;
  color: var(--gray-400);
  line-height: 1.3;
}

.basic-subsection {
  margin-top: 0;
}

.content-section__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding-top: 0;
  border-top: none;
}

.content-section__foot {
  font-size: var(--text-xs);
  color: var(--gray-500);
  margin-top: var(--space-2);
  line-height: 1.35;
}

.content-section__foot a {
  color: var(--brand-blue);
  font-weight: 600;
}

.slot-grid--5-second {
  margin-top: var(--space-2);
}

.slot-card--interactive {
  cursor: pointer;
}

.slot-card--interactive:focus-visible {
  outline: 2px solid var(--brand-blue);
  outline-offset: 2px;
}

.slot-card__hint {
  font-size: 0.625rem;
  color: var(--gray-400);
  margin-top: auto;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.slot-card--interactive:hover .slot-card__hint {
  opacity: 1;
}

.student-list--flat {
  background: transparent;
  border: none;
  border-radius: 0;
}

.student-list__row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--gray-100);
  cursor: pointer;
  transition: background 0.12s ease;
}

.student-list__row:last-child {
  border-bottom: none;
}

.student-list__row:hover {
  background: var(--gray-50);
}

.student-list__row:focus-visible {
  outline: 2px solid var(--brand-blue);
  outline-offset: -2px;
}

.student-list__title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--gray-900);
  margin: 0;
  line-height: 1.3;
}

.student-list__meta {
  font-size: var(--text-xs);
  color: var(--gray-500);
  margin: 0.125rem 0 0;
  line-height: 1.35;
}

.student-list__aside {
  flex-shrink: 0;
  text-align: right;
}

.student-list__status {
  display: inline-block;
  font-size: 0.6875rem;
  font-weight: 600;
  padding: var(--space-1) var(--space-2);
  border-radius: 999px;
}

.student-list__status--open {
  color: #047857;
  background: #d1fae5;
}

.student-list__status--review {
  color: #1d4ed8;
  background: #fef3c7;
}

.student-list__date {
  display: block;
  font-size: var(--text-xs);
  color: var(--gray-400);
  margin-top: 0.125rem;
  line-height: 1.3;
}

.guest-students__foot {
  font-size: var(--text-xs);
  color: var(--gray-500);
  margin-top: var(--space-4);
}

.guest-students__foot a {
  color: var(--brand-blue);
  font-weight: 600;
}

.promo-card {
  background: linear-gradient(145deg, #fff 0%, var(--gray-50) 100%);
  border: 1px solid var(--gray-200);
  border-radius: 0.75rem;
  padding: var(--space-4);
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.promo-card:hover {
  border-color: var(--gray-300);
  box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
}

.promo-card--tall {
  min-height: 14rem;
  display: flex;
  flex-direction: column;
}

.promo-card__tag {
  display: inline-block;
  font-size: 0.625rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--brand-blue);
  margin-bottom: var(--space-2);
}

.promo-card__title {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--gray-900);
  line-height: 1.35;
}

.promo-card__desc {
  font-size: var(--text-xs);
  color: var(--gray-500);
  margin-top: var(--space-2);
  line-height: 1.5;
  flex: 1;
}

.promo-card__cta {
  margin-top: var(--space-4);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--brand-blue);
  text-align: left;
}

.guest-ad-inline {
  margin-bottom: var(--space-3);
}

@media (min-width: 1024px) {
  .guest-ad-inline {
    display: none;
  }
}

.home-sidebar--guest .promo-card + .promo-card {
  margin-top: 0;
}

.right-rail {
  gap: var(--space-3);
}

.right-rail__head,
.right-rail-card,
.right-rail__fallback,
.right-rail__cta,
.right-rail__note {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 0.75rem;
  box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
}

.right-rail__head {
  padding: var(--space-3);
}

.right-rail__eyebrow {
  display: block;
  margin-bottom: var(--space-1);
  font-size: 0.6875rem;
  font-weight: 700;
  color: var(--brand-blue);
}

.right-rail__title {
  display: block;
  font-size: var(--text-sm);
  color: var(--gray-900);
  line-height: 1.35;
}

.right-rail__items {
  display: grid;
  gap: var(--space-2);
}

.right-rail-card {
  display: grid;
  gap: 0.375rem;
  padding: var(--space-3);
  text-decoration: none;
  color: inherit;
}

.right-rail-card:hover {
  border-color: var(--gray-300);
}

.right-rail-card__kind {
  font-size: 0.6875rem;
  color: var(--gray-500);
}

.right-rail-card__title {
  font-size: var(--text-sm);
  color: var(--gray-900);
  line-height: 1.35;
}

.right-rail-card__summary {
  font-size: var(--text-xs);
  color: var(--gray-600);
  line-height: 1.45;
}

.right-rail__cta {
  display: block;
  padding: var(--space-3);
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--brand-blue);
  text-decoration: none;
}

.right-rail__note {
  padding: var(--space-3);
  font-size: 0.6875rem;
  color: var(--gray-500);
  line-height: 1.45;
}

}
.expo-hcard .card-visual__promo--split .card-visual__promo-badge:not(.card-visual__promo-badge--new) {
  border: 1.5px solid transparent;
  background:
    linear-gradient(var(--bg), var(--bg)) padding-box,
    linear-gradient(135deg, var(--l1), var(--l2) 50%, var(--l1)) border-box;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
  position: relative;
  overflow: hidden;
  padding: calc(0.1rem - 1.5px) calc(0.4rem - 1.5px); /* 1.5px border 보정 — 의도적 비스케일 (FS-T1-006) */

  --l1: #c7d2fe;
  --l2: #1e3a8a;

.expo-hcard .card-visual__promo--split .card-visual__promo-badge:not(.card-visual__promo-badge--new)::after {
  content: '';
  position: absolute;
  top: -2px;
  bottom: -2px;
  left: -60%;
  width: 40%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.45), transparent);
  transform: skewX(-20deg);
  animation: s114-sweep 7s ease-in-out infinite;
}
@keyframes s114-sweep {
  0%, 82% { left: -60%; }
  100% { left: 130%; }
}
@media (prefers-reduced-motion: reduce) {
  .expo-hcard .card-visual__promo--split .card-visual__promo-badge--new,
  .expo-hcard .card-visual__promo--split .card-visual__promo-badge:not(.card-visual__promo-badge--new)::after {

  /* 마이샵 */
  /* ShopPage — 원장 마이샵 = 공개 샵 단일 본문 */

.shop {
  --shop-ink: #1c1917;
  --shop-muted: #78716c;
  --shop-line: #e7e5e4;
  --shop-paper: #fffcf8;
  --shop-mint: #0f766e;
  --shop-mint-soft: #ecfdf8;
  --shop-lilac: #6d28d9;
  --shop-lilac-soft: #f5f3ff;
  --shop-sky: #0369a1;
  --shop-sky-soft: #e0f2fe;
  --shop-peach: #c2410c;
  --shop-peach-soft: #fff7ed;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 1.35rem;
  width: 100%;
  max-width: 58rem;
  margin: 0.25rem auto 1.5rem;
  padding: 1.1rem 1.15rem 1.6rem;
  color: var(--shop-ink);
  font-family: var(--font-sans, "Pretendard", "Noto Sans KR", sans-serif);
  background:
    radial-gradient(ellipse 70% 40% at 10% 0%, rgb(224 242 254 / 0.55), transparent 55%),
    radial-gradient(ellipse 50% 35% at 100% 8%, rgb(245 243 255 / 0.5), transparent 50%),
    linear-gradient(180deg, #f8fafc 0%, var(--shop-paper) 28%, #fff 100%);
  border: 1px solid rgb(214 211 209 / 0.85);
  border-radius: 1.35rem;
  box-shadow: 0 0.85rem 2rem rgb(28 25 23 / 0.06);
  overflow: hidden;
  animation: shop-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes shop-in {
  from {
    opacity: 0;
    transform: translateY(0.55rem);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.shop--loading,
.shop--empty {
  min-height: 8rem;
  display: grid;
  place-items: center;
}

/* —— Hero —— */
.shop-hero {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.shop-photos {
  display: grid;
  gap: 0.5rem;
  min-width: 0;
  align-items: start;
}

.shop-photos--top {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.shop-photos--bottom {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.shop-photo {
  position: relative;
  box-sizing: border-box;
  overflow: hidden;
  border: 0;
  padding: 0;
  border-radius: 0.8rem;
  background: #f5f5f4;
  cursor: zoom-in;
  min-width: 0;
}

.shop-photos--bottom .shop-photo {
  aspect-ratio: 1 / 1;
}

.shop-photo img {
  position: relative;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.shop-photo--empty {
  cursor: default;
}

.shop-photo--empty::before {
  content: none;
}

.shop-photos--top .shop-photo {
  aspect-ratio: auto;
}

.shop-photo--framed {
  padding: 6px;
  background: #fff;
  border: 1px solid var(--uds-line, #E3E8EF);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
}

.shop-photo--framed::before {
  content: none;
}

.shop-photo__area {
  position: relative;
  display: block;
  overflow: hidden;
  aspect-ratio: 4 / 3;
  border-radius: 3px;
  background: #f5f5f4;
}

.shop-photos--top .shop-photo--empty {
  aspect-ratio: 4 / 3;
  width: calc(100% - 14px);
  margin-top: 7px;
  justify-self: center;
}

.shop-photo__cap {
  position: absolute;
  left: 0.4rem;
  bottom: 0.4rem;
  z-index: 1;
  max-width: calc(100% - 0.8rem);
  padding: 0.15rem 0.45rem;
  font-size: 0.7rem;
  font-weight: 650;
  line-height: 1.3;
  color: #fff;
  background: rgb(28 25 23 / 0.55);
  border-radius: 999px;
  pointer-events: none;
}

@media (max-width: 720px) {
  .shop-photos--bottom {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.shop-hero__card {
